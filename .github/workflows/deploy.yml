name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger button GitHub UI te

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/ezboai && bash infrastructure/deploy.sh"

      - name: Verify deployment
        run: |
          sleep 5
          curl -fsSL --max-time 30 https://${{ secrets.DEPLOY_HEALTH_URL }} > /dev/null \
            && echo "✓ Site responding" \
            || echo "⚠ Site not responding (may still be starting)"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy failed. SSH into VPS and run 'pm2 logs ezboai-api' to debug."
